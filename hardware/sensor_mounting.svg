<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#334"/></marker>
    <style>
      .box{fill:#eef4fb;stroke:#2b5f9e;stroke-width:2}
      .box2{fill:#fdf1e6;stroke:#c07a2b;stroke-width:2}
      .box3{fill:#eafaf0;stroke:#2f8f52;stroke-width:2}
      .box4{fill:#fdeaea;stroke:#b33;stroke-width:2}
      .t{font-size:14px;fill:#1a2330;text-anchor:middle;font-weight:bold}
      .ts{font-size:11px;fill:#556;text-anchor:middle}
      .wire{stroke:#334;stroke-width:2;fill:none;marker-end:url(#arw)}
      .title{font-size:21px;font-weight:bold;fill:#12283f;text-anchor:middle}
      .sub{font-size:12.5px;fill:#556;text-anchor:middle}
      .lbl{font-size:11px;fill:#334;text-anchor:middle}
    </style>
  </defs>
  <text x="620" y="34" class="title">Размещение датчиков: обзор 360°</text>
  <text x="620" y="56" class="sub">Кольцо 4× A121 (шаг 90°, FoV ~120°, наклон 10°↓) + 1 вверх + 1 вниз = 6 каналов</text>
  <path d="M300.0,400.0 L100.8,285.0 A230,230 0 0 1 499.2,285.0 Z" fill="#2980b9" opacity="0.28"/>
  <path d="M300.0,400.0 L415.0,200.8 A230,230 0 0 1 415.0,599.2 Z" fill="#8e44ad" opacity="0.28"/>
  <path d="M300.0,400.0 L499.2,515.0 A230,230 0 0 1 100.8,515.0 Z" fill="#e67e22" opacity="0.28"/>
  <path d="M300.0,400.0 L185.0,599.2 A230,230 0 0 1 185.0,200.8 Z" fill="#16a085" opacity="0.28"/>
  <path d="M300.0,400.0 L100.8,285.0 A230,230 0 0 1 499.2,285.0 Z" fill="none" stroke="#334" stroke-width="0.8" opacity="0.5"/>
  <path d="M300.0,400.0 L415.0,200.8 A230,230 0 0 1 415.0,599.2 Z" fill="none" stroke="#334" stroke-width="0.8" opacity="0.5"/>
  <path d="M300.0,400.0 L499.2,515.0 A230,230 0 0 1 100.8,515.0 Z" fill="none" stroke="#334" stroke-width="0.8" opacity="0.5"/>
  <path d="M300.0,400.0 L185.0,599.2 A230,230 0 0 1 185.0,200.8 Z" fill="none" stroke="#334" stroke-width="0.8" opacity="0.5"/>
  <circle cx="300" cy="400" r="42" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="300" y="398" class="ts" font-size="11">БПЛА</text>
  <text x="300" y="414" class="ts" font-size="9">(центр)</text>
  <circle cx="300" cy="328" r="8" fill="#2980b9" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="300.0" y="300.0" class="ts" font-weight="bold" font-size="11">S1 · 0°</text>
  <circle cx="372" cy="400" r="8" fill="#8e44ad" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="400.0" y="400.0" class="ts" font-weight="bold" font-size="11">S2 · 90°</text>
  <circle cx="300" cy="472" r="8" fill="#e67e22" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="300.0" y="500.0" class="ts" font-weight="bold" font-size="11">S3 · 180°</text>
  <circle cx="228" cy="400" r="8" fill="#16a085" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="200.0" y="400.0" class="ts" font-weight="bold" font-size="11">S4 · 270°</text>
  <text x="300" y="672" class="ts">4 × 120° = 480° → перекрытие 30° на стык, «мёртвых зон» нет</text>
  <text x="300" y="692" class="ts">FoV ~120° (полусферическая антенна A121 без линзы)</text>
  <text x="930" y="96" class="t" font-size="15">Вид сбоку — вертикальные каналы</text>
  <line x1="650" y1="640" x2="1180" y2="640" stroke="#2e7d32" stroke-width="3"/>
  <rect x="650" y="640" width="530" height="34" fill="#e8f5e9"/>
  <text x="915" y="662" class="ts" fill="#2e7d32">земля / полоса</text>
  <line x1="650" y1="170" x2="1180" y2="170" stroke="#5d4037" stroke-width="3"/>
  <rect x="650" y="136" width="530" height="34" fill="#efebe9"/>
  <text x="915" y="158" class="ts" fill="#5d4037">потолок / верхнее препятствие</text>
  <rect x="875" y="380" width="90" height="34" rx="8" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="920" y="401" class="ts" font-size="11">БПЛА</text>
  <line x1="875" y1="397" x2="670" y2="444" stroke="#2980b9" stroke-width="2"/>
  <path d="M875,397 L670,406 L670,478 Z" fill="#2980b9" opacity="0.18"/>
  <line x1="965" y1="397" x2="1170" y2="444" stroke="#2980b9" stroke-width="2"/>
  <path d="M965,397 L1170,406 L1170,478 Z" fill="#2980b9" opacity="0.18"/>
  <text x="920" y="470" class="ts" fill="#1a3a6b">кольцо: наклон 10°↓ (видит стены и землю впереди)</text>
  <line x1="920" y1="380" x2="920" y2="180" stroke="#7fd0ff" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M920,180 L888,250 L952,250 Z" fill="#7fd0ff" opacity="0.35"/>
  <text x="985" y="210" class="ts" fill="#0b6b9c">U6 — A121 вверх (потолок)</text>
  <line x1="920" y1="414" x2="920" y2="632" stroke="#37d67a" stroke-width="2.2" stroke-dasharray="6 4"/>
  <path d="M920,632 L888,566 L952,566 Z" fill="#37d67a" opacity="0.35"/>
  <text x="985" y="596" class="ts" fill="#1a7a44">U1 — A121 вниз (высота, ≤ 1 мс)</text>
  <line x1="1180" y1="414" x2="1180" y2="632" stroke="#666" stroke-width="0.8"/>
  <text x="1150" y="528" class="ts" fill="#333">H = 2…10 м</text>
  <rect x="60" y="730" width="1120" height="160" rx="10" fill="#f7f9fc" stroke="#d0d7e2"/>
  <text x="80" y="758" class="t" text-anchor="start" font-size="14">Почему именно так</text>
  <text x="80" y="786" class="lbl" text-anchor="start" font-size="12">• 4 датчика в кольце: при FoV ~120° шаг 90° &lt; 120° → сплошное покрытие с перекрытием 30°.</text>
  <text x="80" y="810" class="lbl" text-anchor="start" font-size="12">• Наклон 10° вниз: одновременно видит и землю впереди при снижении, и стены на высоте полёта.</text>
  <text x="80" y="834" class="lbl" text-anchor="start" font-size="12">• Ноль азимута = нос БПЛА: сектор S1 всегда смотрит вперёд, независимо от эволюций.</text>
  <text x="80" y="858" class="lbl" text-anchor="start" font-size="12">• Выносные кронштейны: винты и корпус не затеняют обзор кольца.</text>
  <text x="80" y="882" class="lbl" text-anchor="start" font-size="12">• Один тип датчика (A121) на все каналы: единая прошивка, единая ЭКБ, взаимозаменяемость.</text>
</svg>
