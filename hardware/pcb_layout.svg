  <text x="300" y="594" class="ruleh">Правила проектирования и трассировки</text>
  <text x="300" y="622" class="rule">• Стек: 4 слоя — L1 сигналы, L2 сплошная земля (GND), L3 питание (+3,3 В / +5 В), L4 сигналы/земля. FR-4, 1,6 мм, εr ≈ 4,3.</text>
  <text x="300" y="648" class="rule">• Ширина проводников: сигнал 0,2 мм · питание 0,5…1,0 мм (по току) · CAN — 0,25 мм с зазором 0,25 мм.</text>
  <text x="300" y="674" class="rule">• CAN (ISO 11898): диффпара 120 Ом, длина шлейфа &lt; 10 мм, терминатор 120 Ом у разъёма J1.</text>
  <text x="300" y="700" class="rule">• SPI (до 20…50 МГц): длина линий ≤ 50 мм, согласование длин SCK/MOSI/MISO ±5 мм, без разрывов опорного слоя.</text>
  <text x="300" y="726" class="rule">• Зоны запрета: под антеннами 60 ГГц (U1 и все XM125) — без меди и без металла; зазор ≥ 5 мм по краю.</text>
  <text x="300" y="752" class="rule">• Переходные отверстия: Ø 0,3/0,6 мм; для питания и земли — по 2…3 шт. рядом с выводами (снижение индуктивности).</text>
  <text x="300" y="778" class="rule">• Питание: TVS SMBJ5.0A и предохранитель F1 — у входа J1; керамика 100 нФ + 10 мкФ у каждого модуля XM125 и MCU.</text>
  <text x="300" y="804" class="rule">• ЭМС: экран (заливка GND) между цифровыми и радиочастотными цепями; линию зуммера — в стороне от антенн.</text>
  <text x="300" y="830" class="rule">• Механика: 4 отверстия M2.5, крепёж с фиксацией резьбы; заливка компаундом для стойкости к 10g / 3g.</text>
  <text x="300" y="856" class="rule">• Габарит: плата-носитель 64×48 мм (4 слоя) + 6× плата датчика 26×26 мм (2 слоя) на кронштейнах.</text>
  <text x="300" y="886" class="rule">Итог: трассировка обеспечивает SPI-опрос 6 датчиков и CAN-связь с СУ БПЛА; зоны под антеннами свободны от меди.</text>
</svg>
