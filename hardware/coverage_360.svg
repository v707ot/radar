<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#334"/></marker>
    <style>
      .box{fill:#eef4fb;stroke:#2b5f9e;stroke-width:2}
      .box2{fill:#fdf1e6;stroke:#c07a2b;stroke-width:2}
      .box3{fill:#eafaf0;stroke:#2f8f52;stroke-width:2}
      .box4{fill:#fdeaea;stroke:#b33;stroke-width:2}
      .t{font-size:14px;fill:#1a2330;text-anchor:middle;font-weight:bold}
      .ts{font-size:11px;fill:#556;text-anchor:middle}
      .wire{stroke:#334;stroke-width:2;fill:none;marker-end:url(#arw)}
      .title{font-size:21px;font-weight:bold;fill:#12283f;text-anchor:middle}
      .sub{font-size:12.5px;fill:#556;text-anchor:middle}
      .lbl{font-size:11px;fill:#334;text-anchor:middle}
    </style>
  </defs>
  <text x="620" y="34" class="title">Покрытие 360°: земля, стены, потолок</text>
  <text x="620" y="56" class="sub">6× радар Acconeer A121 (60 ГГц PCR) — единый тип датчика на все направления</text>
  <text x="300" y="96" class="t" font-size="15">Вид сверху (горизонтальный обзор)</text>
  <path d="M300.0,380.0 L92.2,260.0 A240,240 0 0 1 507.8,260.0 Z" fill="#27ae60" opacity="0.35"/>
  <path d="M300.0,380.0 L420.0,172.2 A240,240 0 0 1 420.0,587.8 Z" fill="#2980b9" opacity="0.35"/>
  <path d="M300.0,380.0 L507.8,500.0 A240,240 0 0 1 92.2,500.0 Z" fill="#8e44ad" opacity="0.35"/>
  <path d="M300.0,380.0 L180.0,587.8 A240,240 0 0 1 180.0,172.2 Z" fill="#e67e22" opacity="0.35"/>
  <circle cx="300" cy="380" r="36" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="300" y="378" class="ts" font-size="10">БПЛА</text>
  <text x="300" y="394" class="ts" font-size="9">+ 6 датчиков</text>
  <text x="300.0" y="294.0" class="ts" font-weight="bold" font-size="12">№1</text>
  <text x="386.0" y="380.0" class="ts" font-weight="bold" font-size="12">№2</text>
  <text x="300.0" y="466.0" class="ts" font-weight="bold" font-size="12">№3</text>
  <text x="214.0" y="380.0" class="ts" font-weight="bold" font-size="12">№4</text>
  <circle cx="300" cy="380" r="240" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="300" y="150" class="ts">дальность до стен — до 12 м (A121)</text>
  <text x="300" y="676" class="ts">4 × 120° = 480° → перекрытие 30°, «мёртвых зон» нет</text>
  <text x="300" y="696" class="ts">Масса кольца ≈ 12 г · цена ≈ 4× (при серии — чип A121)</text>
  <text x="900" y="96" class="t" font-size="15">Вид сбоку (вертикальный обзор)</text>
  <line x1="680" y1="140" x2="1130" y2="140" stroke="#8a1c10" stroke-width="3"/>
  <text x="905" y="130" class="ts" fill="#8a1c10">потолок</text>
  <line x1="680" y1="140" x2="680" y2="620" stroke="#8a5000" stroke-width="3"/>
  <text x="720" y="180" class="ts" fill="#8a5000" text-anchor="start">стена</text>
  <line x1="680" y1="620" x2="1130" y2="620" stroke="#1a5b2b" stroke-width="3"/>
  <text x="905" y="645" class="ts" fill="#1a5b2b">земля / пол</text>
  <rect x="875" y="362" width="60" height="30" rx="6" fill="#e8f0fe" stroke="#3367d6" stroke-width="2"/>
  <text x="905" y="382" class="ts" font-size="11">БПЛА</text>
  <path d="M905,362 L858,150 L952,150 Z" fill="#c0392b" opacity="0.3"/>
  <text x="1000" y="250" class="ts" fill="#8a1c10" text-anchor="start">вверх (потолок)</text>
  <text x="1000" y="268" class="ts" fill="#666" text-anchor="start">A121, до 12 м</text>
  <path d="M905,392 L850,610 L960,610 Z" fill="#1a5b2b" opacity="0.25"/>
  <text x="1000" y="520" class="ts" fill="#1a5b2b" text-anchor="start">вниз (высота)</text>
  <text x="1000" y="538" class="ts" fill="#666" text-anchor="start">A121, 2…10 м</text>
  <text x="1000" y="556" class="ts" fill="#8a1c10" text-anchor="start">реакция ≤ 1 мс</text>
  <line x1="875" y1="377" x2="695" y2="377" stroke="#8a5000" stroke-width="2" marker-end="url(#arw)"/>
  <text x="780" y="412" class="ts" fill="#8a5000">в стороны (стены)</text>
  <text x="780" y="430" class="ts" fill="#666">кольцо A121, до 12 м</text>
  <line x1="1040" y1="377" x2="1040" y2="620" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="1055" y="500" class="ts" fill="#333" text-anchor="start">H = 2…10 м</text>
  <rect x="60" y="730" width="1120" height="140" rx="10" fill="#f7f7f7" stroke="#ddd"/>
  <text x="80" y="758" class="t" text-anchor="start" font-size="13">Состав датчиков:</text>
  <rect x="80" y="770" width="14" height="14" fill="#2980b9"/>
  <text x="100" y="782" class="lbl" text-anchor="start">4× A121 — горизонт 360° (стены/земля), FoV ~120°, до 12 м, наклон 10°↓</text>
  <rect x="80" y="794" width="14" height="14" fill="#c0392b"/>
  <text x="100" y="806" class="lbl" text-anchor="start">1× A121 — вверх (потолок), до 12 м</text>
  <rect x="80" y="818" width="14" height="14" fill="#1a5b2b"/>
  <text x="100" y="830" class="lbl" text-anchor="start">1× A121 — вниз (высота 2…10 м), реакция ≤ 1 мс, всепогодный</text>
  <text x="80" y="846" class="lbl" text-anchor="start" font-size="11" fill="#8a1c10">⚠️ Все каналы — на одном типе датчика A121; масса изделия 84 г, серийная себестоимость ≈ 13 700 ₽ (в пределах ТЗ).</text>
</svg>
