<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="600" y="34" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Временная диаграмма реакции</text>
  <text x="600" y="58" font-size="13" text-anchor="middle" fill="#666">От пересечения порога H_ср до срабатывания сигнала</text>

  <!-- time axis -->
  <line x1="120" y1="600" x2="1140" y2="600" stroke="#333" stroke-width="2"/>
  <polygon points="1140,600 1128,595 1128,605" fill="#333"/>
  <text x="1146" y="605" font-size="12" fill="#333">t</text>

  <!-- markers t0..t4 -->
  <g stroke="#888" stroke-width="1" stroke-dasharray="4 4">
    <line x1="230" y1="90" x2="230" y2="600"/>
    <line x1="430" y1="90" x2="430" y2="600"/>
    <line x1="620" y1="90" x2="620" y2="600"/>
    <line x1="760" y1="90" x2="760" y2="600"/>
    <line x1="900" y1="90" x2="900" y2="600"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#333" text-anchor="middle">
    <text x="230" y="640">t₀</text>
    <text x="430" y="640">t₁</text>
    <text x="620" y="640">t₂</text>
    <text x="760" y="640">t₃</text>
    <text x="900" y="640">t₄</text>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="230" y="658">высота &lt; H_ср</text>
    <text x="430" y="658">измерение готово</text>
    <text x="620" y="658">кадр принят</text>
    <text x="760" y="658">порог сравнён</text>
    <text x="900" y="658">выход активен</text>
  </g>

  <!-- signal 1: Высота h(t) -->
  <text x="60" y="120" font-size="12" font-weight="bold" fill="#333">Высота h(t)</text>
  <line x1="120" y1="180" x2="1140" y2="180" stroke="#eee"/>
  <line x1="120" y1="220" x2="1140" y2="220" stroke="#eee"/>
  <!-- threshold line -->
  <line x1="120" y1="220" x2="1140" y2="220" stroke="#e0a800" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1146" y="224" font-size="10" fill="#8a6100">H_ср</text>
  <!-- descending curve -->
  <path d="M120,110 C300,120 400,180 520,220 C640,260 780,300 1140,340" fill="none" stroke="#3367d6" stroke-width="2.5"/>
  <circle cx="520" cy="220" r="5" fill="#c0392b"/>

  <!-- signal 2: Данные датчика (кадры) -->
  <text x="60" y="300" font-size="12" font-weight="bold" fill="#333">Кадры датчика</text>
  <line x1="120" y1="340" x2="1140" y2="340" stroke="#ddd"/>
  <g fill="#27ae60">
    <rect x="150" y="322" width="16" height="18"/><rect x="280" y="322" width="16" height="18"/>
    <rect x="410" y="322" width="16" height="18"/><rect x="540" y="322" width="16" height="18"/>
    <rect x="670" y="322" width="16" height="18"/><rect x="800" y="322" width="16" height="18"/>
    <rect x="930" y="322" width="16" height="18"/><rect x="1060" y="322" width="16" height="18"/>
  </g>
  <text x="180" y="360" font-size="10" fill="#666">период обновления T_обн = 1/f</text>

  <!-- signal 3: Обработка MCU -->
  <text x="60" y="410" font-size="12" font-weight="bold" fill="#333">Обработка MCU</text>
  <line x1="120" y1="450" x2="1140" y2="450" stroke="#ddd"/>
  <rect x="620" y="432" width="140" height="18" fill="#9b59b6" opacity="0.7"/>
  <text x="690" y="445" font-size="10" fill="#fff" text-anchor="middle">разбор+фильтр+сравнение (~20 мкс)</text>

  <!-- signal 4: Флаг LOW ALT -->
  <text x="60" y="500" font-size="12" font-weight="bold" fill="#333">Флаг / выход</text>
  <line x1="120" y1="540" x2="1140" y2="540" stroke="#ddd"/>
  <path d="M120,540 L900,540 L900,510 L1140,510" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="950" y="528" font-size="11" fill="#8a1c10">LOW ALT = 1</text>
  <circle cx="900" cy="540" r="4" fill="#c0392b"/>

  <!-- annotations -->
  <text x="330" y="250" font-size="11" fill="#3367d6">снижение</text>
  <text x="660" y="200" font-size="11" fill="#666">T_задержки = t₄ − t₀</text>
  <line x1="230" y1="190" x2="900" y2="190" stroke="#666" stroke-width="1"/>
  <line x1="230" y1="185" x2="230" y2="195" stroke="#666"/>
  <line x1="900" y1="185" x2="900" y2="195" stroke="#666"/>

  <!-- legend -->
  <rect x="60" y="665" width="1080" height="28" rx="6" fill="#f7f7f7" stroke="#ddd"/>
  <text x="80" y="684" font-size="11" fill="#333">Электронная задержка (t₂→t₄) ≈ 25 мкс. Полная задержка (t₀→t₄) = период датчика + передача + обработка + выдача.</text>
</svg>
