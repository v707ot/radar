<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#334"/></marker>
    <style>
      .box{fill:#eef4fb;stroke:#2b5f9e;stroke-width:2}
      .box2{fill:#fdf1e6;stroke:#c07a2b;stroke-width:2}
      .box3{fill:#eafaf0;stroke:#2f8f52;stroke-width:2}
      .box4{fill:#fdeaea;stroke:#b33;stroke-width:2}
      .t{font-size:14px;fill:#1a2330;text-anchor:middle;font-weight:bold}
      .ts{font-size:11px;fill:#556;text-anchor:middle}
      .wire{stroke:#334;stroke-width:2;fill:none;marker-end:url(#arw)}
      .title{font-size:21px;font-weight:bold;fill:#12283f;text-anchor:middle}
      .sub{font-size:12.5px;fill:#556;text-anchor:middle}
      .lbl{font-size:11px;fill:#334;text-anchor:middle}
    </style>
  </defs>
  <rect width="1240" height="720" fill="#ffffff"/>
  <text x="620" y="34" class="title">Временная диаграмма реакции (радар A121, SPI)</text>
  <text x="620" y="58" class="sub">От пересечения порога H_ср до срабатывания сигнала — не более 1 мс</text>
  <line x1="120" y1="600" x2="1160" y2="600" stroke="#333" stroke-width="2"/>
  <polygon points="1160,600 1148,595 1148,605" fill="#333"/>
  <text x="1166" y="605" class="lbl" text-anchor="start">t</text>
  <line x1="240" y1="96" x2="240" y2="600" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="240" y="640" class="lbl" font-size="13" font-weight="bold">t₀</text>
  <text x="240" y="658" class="lbl" font-size="10" fill="#666">высота &lt; H_ср</text>
  <line x1="520" y1="96" x2="520" y2="600" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="520" y="640" class="lbl" font-size="13" font-weight="bold">t₁</text>
  <text x="520" y="658" class="lbl" font-size="10" fill="#666">кадр готов (HSM)</text>
  <line x1="700" y1="96" x2="700" y2="600" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="700" y="640" class="lbl" font-size="13" font-weight="bold">t₂</text>
  <text x="700" y="658" class="lbl" font-size="10" fill="#666">SPI-кадр принят</text>
  <line x1="850" y1="96" x2="850" y2="600" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="850" y="640" class="lbl" font-size="13" font-weight="bold">t₃</text>
  <text x="850" y="658" class="lbl" font-size="10" fill="#666">порог сравнён</text>
  <line x1="1000" y1="96" x2="1000" y2="600" stroke="#888" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="1000" y="640" class="lbl" font-size="13" font-weight="bold">t₄</text>
  <text x="1000" y="658" class="lbl" font-size="10" fill="#666">выход активен</text>
  <text x="70" y="120" class="lbl" text-anchor="start" font-size="12" font-weight="bold">Высота h(t)</text>
  <line x1="120" y1="220" x2="1160" y2="220" stroke="#e0a800" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1166" y="224" class="lbl" text-anchor="start" font-size="10" fill="#8a6100">H_ср</text>
  <path d="M120,110 C320,120 420,180 540,220 C680,262 820,300 1160,344" fill="none" stroke="#3367d6" stroke-width="2.5"/>
  <circle cx="540" cy="220" r="5" fill="#c0392b"/>
  <text x="70" y="300" class="lbl" text-anchor="start" font-size="12" font-weight="bold">Кадры A121</text>
  <line x1="120" y1="340" x2="1160" y2="340" stroke="#ddd"/>
  <rect x="170" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="270" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="370" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="470" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="570" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="670" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="770" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="870" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="970" y="322" width="18" height="18" fill="#27ae60"/>
  <rect x="1070" y="322" width="18" height="18" fill="#27ae60"/>
  <text x="250" y="362" class="lbl" text-anchor="start" font-size="10" fill="#666">период кадров T_обн ≈ 0,2…0,5 мс (режим HSM)</text>
  <text x="70" y="420" class="lbl" text-anchor="start" font-size="12" font-weight="bold">Обработка MCU</text>
  <line x1="120" y1="460" x2="1160" y2="460" stroke="#ddd"/>
  <rect x="700" y="442" width="150" height="18" fill="#9b59b6" opacity="0.7"/>
  <text x="775" y="455" class="lbl" font-size="10" fill="#fff">разбор+фильтр+сравнение (~20 мкс)</text>
  <text x="70" y="520" class="lbl" text-anchor="start" font-size="12" font-weight="bold">Флаг / выход</text>
  <line x1="120" y1="560" x2="1160" y2="560" stroke="#ddd"/>
  <path d="M120,560 L1000,560 L1000,530 L1160,530" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="1050" y="548" class="lbl" text-anchor="start" font-size="11" fill="#8a1c10">LOW ALT = 1</text>
  <circle cx="1000" cy="560" r="4" fill="#c0392b"/>
  <line x1="240" y1="196" x2="1000" y2="196" stroke="#666" stroke-width="1"/>
  <line x1="240" y1="191" x2="240" y2="201" stroke="#666"/>
  <line x1="1000" y1="191" x2="1000" y2="201" stroke="#666"/>
  <text x="620" y="188" class="lbl" font-size="12" fill="#666">T_реакции = t₄ − t₀ ≤ 1 мс</text>
  <rect x="60" y="670" width="1120" height="34" rx="6" fill="#f7f7f7" stroke="#ddd"/>
  <text x="80" y="692" class="lbl" text-anchor="start" font-size="11">Составляющие: кадр A121 (~0,2…0,5 мс, HSM) + SPI-передача (~30…100 мкс) + обработка (~20 мкс) + выдача (~5 мкс).</text>
</svg>
