<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="960" viewBox="0 0 1300 960" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#334"/></marker>
    <style>
      .box{fill:#eef4fb;stroke:#2b5f9e;stroke-width:2}
      .box2{fill:#fdf1e6;stroke:#c07a2b;stroke-width:2}
      .box3{fill:#eafaf0;stroke:#2f8f52;stroke-width:2}
      .box4{fill:#fdeaea;stroke:#b33;stroke-width:2}
      .t{font-size:14px;fill:#1a2330;text-anchor:middle;font-weight:bold}
      .ts{font-size:11px;fill:#556;text-anchor:middle}
      .wire{stroke:#334;stroke-width:2;fill:none;marker-end:url(#arw)}
      .title{font-size:21px;font-weight:bold;fill:#12283f;text-anchor:middle}
      .sub{font-size:12.5px;fill:#556;text-anchor:middle}
      .lbl{font-size:11px;fill:#334;text-anchor:middle}
    </style>
  </defs>
  <text x="650" y="32" class="title">Схема электрическая принципиальная (макет, модульная сборка)</text>
  <text x="650" y="54" class="sub">Питание 5 В от BEC · MCU STM32G474 · 6× A121 на общем SPI · оповещение и CAN-выход</text>
  <rect class="box2" x="40" y="92" width="150" height="66"/>
  <text x="115" y="120" class="t">BEC +5 В</text>
  <text x="115" y="140" class="ts">бортовая сеть</text>
  <rect class="box2" x="240" y="92" width="190" height="66"/>
  <text x="335" y="118" class="t">D24V5F3</text>
  <text x="335" y="138" class="ts">+3,3 В, 500 мА</text>
  <path class="wire" d="M190,125 L240,125"/>
  <rect class="box2" x="40" y="196" width="150" height="60"/>
  <text x="115" y="220" class="t">TVS + предохр.</text>
  <text x="115" y="240" class="ts">защита питания</text>
  <path class="wire" d="M115,158 L115,196"/>
  <rect class="box" x="500" y="150" width="360" height="430"/>
  <text x="680" y="184" class="t">STM32G474 (Nucleo или своя PCB)</text>
  <text x="680" y="204" class="ts">SPI1 — все A121 · CAN — СУ БПЛА</text>
  <text x="516" y="250" class="ts" text-anchor="start" font-weight="bold">PA5  SPI1_SCK</text>
  <text x="844" y="250" class="ts" text-anchor="end">общий такт SPI</text>
  <text x="516" y="282" class="ts" text-anchor="start" font-weight="bold">PA6  SPI1_MISO</text>
  <text x="844" y="282" class="ts" text-anchor="end">данные от A121</text>
  <text x="516" y="314" class="ts" text-anchor="start" font-weight="bold">PA7  SPI1_MOSI</text>
  <text x="844" y="314" class="ts" text-anchor="end">данные к A121</text>
  <text x="516" y="346" class="ts" text-anchor="start" font-weight="bold">PA4/PC4..PC8  CS1..CS6</text>
  <text x="844" y="346" class="ts" text-anchor="end">выбор датчика (6 линий)</text>
  <text x="516" y="378" class="ts" text-anchor="start" font-weight="bold">PB0..PB5  INT1..INT6</text>
  <text x="844" y="378" class="ts" text-anchor="end">готовность данных</text>
  <text x="516" y="410" class="ts" text-anchor="start" font-weight="bold">PA11 CAN_RX / PA12 CAN_TX</text>
  <text x="844" y="410" class="ts" text-anchor="end">к TJA1051</text>
  <text x="516" y="442" class="ts" text-anchor="start" font-weight="bold">PB6  GPIO → зуммер</text>
  <text x="844" y="442" class="ts" text-anchor="end">через 2N7002</text>
  <text x="516" y="474" class="ts" text-anchor="start" font-weight="bold">PB7  GPIO → LED</text>
  <text x="844" y="474" class="ts" text-anchor="end">через R 1 кОм</text>
  <text x="516" y="506" class="ts" text-anchor="start" font-weight="bold">PB8  GPIO → «LOW ALT»</text>
  <text x="844" y="506" class="ts" text-anchor="end">откр. сток / оптопара</text>
  <text x="516" y="538" class="ts" text-anchor="start" font-weight="bold">3V3 / GND</text>
  <text x="844" y="538" class="ts" text-anchor="end">питание логики</text>
  <rect class="box3" x="40" y="320" width="330" height="250"/>
  <text x="205" y="348" class="t">6× радар Acconeer A121 (модуль XM125)</text>
  <text x="205" y="372" class="ts" text-anchor="start">U1: SCK/MISO/MOSI — общая шина SPI · CS1 — отдельная</text>
  <text x="205" y="402" class="ts" text-anchor="start">U2: SCK/MISO/MOSI — общая шина SPI · CS2 — отдельная</text>
  <text x="205" y="432" class="ts" text-anchor="start">U3: SCK/MISO/MOSI — общая шина SPI · CS3 — отдельная</text>
  <text x="205" y="462" class="ts" text-anchor="start">U4: SCK/MISO/MOSI — общая шина SPI · CS4 — отдельная</text>
  <text x="205" y="492" class="ts" text-anchor="start">U5: SCK/MISO/MOSI — общая шина SPI · CS5 — отдельная</text>
  <text x="205" y="522" class="ts" text-anchor="start">U6: SCK/MISO/MOSI — общая шина SPI · CS6 — отдельная</text>
  <text x="205" y="556" class="ts" text-anchor="start">Питание +3,3 В, GND · INT — прерывание готовности</text>
  <path class="wire" d="M370,430 C440,430 440,282 500,282"/>
  <path class="wire" d="M500,346 C440,346 430,430 370,430"/>
  <rect class="box" x="940" y="230" width="180" height="120"/>
  <text x="1030" y="262" class="t">TJA1051</text>
  <text x="1030" y="284" class="ts">CAN-трансивер</text>
  <text x="1030" y="304" class="ts">120 Ом терминатор</text>
  <text x="1030" y="324" class="ts">CANH / CANL</text>
  <path class="wire" d="M860,374 L940,300"/>
  <path class="wire" d="M860,406 L940,320"/>
  <rect class="box" x="1150" y="250" width="120" height="90"/>
  <text x="1210" y="282" class="t">СУ БПЛА</text>
  <text x="1210" y="304" class="ts">CAN-шина</text>
  <text x="1210" y="324" class="ts">уставка H_ср</text>
  <path class="wire" d="M1120,295 L1150,295"/>
  <rect class="box4" x="940" y="420" width="180" height="60"/>
  <text x="1030" y="445" class="t">Зуммер (через Q1)</text>
  <text x="1030" y="465" class="ts">N-MOSFET + диод</text>
  <path class="wire" d="M860,470 L940,445"/>
  <rect class="box4" x="940" y="500" width="180" height="60"/>
  <text x="1030" y="525" class="t">LED (через R)</text>
  <text x="1030" y="545" class="ts">R = 1 кОм</text>
  <path class="wire" d="M860,502 L940,525"/>
  <rect class="box4" x="940" y="580" width="180" height="66"/>
  <text x="1030" y="606" class="t">«LOW ALT»</text>
  <text x="1030" y="626" class="ts">оптопара / откр. сток</text>
  <path class="wire" d="M860,534 L940,606"/>
  <path class="wire" d="M430,125 L430,560 L500,560"/>
  <text x="452" y="150" class="lbl" text-anchor="start">+3,3 В</text>
  <text x="120" y="760" class="lbl" text-anchor="start">Примечания: 1) Макет — готовые модули XM125 + Nucleo, соединённые проводами; своя PCB — на этапе опытного образца.</text>
  <text x="120" y="784" class="lbl" text-anchor="start">2) Все A121 работают на общем SPI; выбор датчика — линией CS, готовность — линией INT.</text>
  <text x="120" y="808" class="lbl" text-anchor="start">3) Питание A121 — +3,3 В (на модуле XM125 есть свой стабилизатор ядра 1,8 В). Уровни SPI — 3,3 В.</text>
  <text x="120" y="832" class="lbl" text-anchor="start">4) «LOW ALT» — только сигнальный выход (флаг/индикация). Никаких инициирующих цепей.</text>
  <text x="120" y="856" class="lbl" text-anchor="start">5) SPI до 20…50 МГц — обеспечивает съём сырых данных за десятки микросекунд (см. временную диаграмму).</text>
</svg>
